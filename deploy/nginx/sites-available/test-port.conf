server {
    listen 8765 ssl;                        # MUST include 'ssl' keyword
    server_name ipfs.lochner.tech;

    root /var/www/test-static;
    index index.html index.htm;

    # SSL Certificate Paths (from Certbot standalone)
    ssl_certificate     /etc/letsencrypt/live/ipfs.lochner.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ipfs.lochner.tech/privkey.pem;

    # TLS Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # CORS Headers
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "*" always;

    location / {
        try_files $uri $uri/ =404;
        autoindex on;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    access_log off;
}
